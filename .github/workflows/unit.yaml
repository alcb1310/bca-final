name: Unit-tests
on: pull_request
jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: 23
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Tests
        run: pnpm test
